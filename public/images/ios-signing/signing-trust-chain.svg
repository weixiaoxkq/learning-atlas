<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" role="img">
<title>iOS 代码签名信任链</title>
<desc>上方 Apple 作为证书颁发方，签发证书，iPhone 内置信任它。左边你的 Mac 里有三样：私钥只在这台 Mac 用来盖章，证书是 Apple 担保的公开身份，描述文件是写明哪个 App 能装哪台设备的许可证。codesign 用它们生成签好名的 App，App 内含描述文件。右边 iPhone 安装和启动时检查四项：签名有效且没被改过，证书是 Apple 签发的，描述文件包含这台设备，权限没超出描述文件。</desc><style>svg{--t:#73726C;--b:#D3D1C7;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}.t{font-size:14px;fill:#1F1E1D}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#1F1E1D}.box{fill:#F5F4EF;stroke:#B4B2A9}.arr{stroke:#73726C;stroke-width:1.5;fill:none}.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.t,.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.t,.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.t,.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.t,.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-green>rect,.c-green>circle,.c-green>ellipse,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>.t,.c-green>.th{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>.t,.c-blue>.th{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.t,.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}</style><rect x="0" y="0" width="680" height="392" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray">
<rect x="230" y="30" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="49" text-anchor="middle" dominant-baseline="central">Apple（证书颁发方）</text>
<text class="ts" x="340" y="68" text-anchor="middle" dominant-baseline="central">签发证书，iPhone 信任它</text>
</g>
<g class="c-teal">
<rect x="40" y="110" width="210" height="256" rx="16" stroke-width="0.5"/>
<text class="th" x="145" y="132" text-anchor="middle" dominant-baseline="central">你的 Mac</text>
</g>
<rect class="box" x="55" y="150" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="145" y="169" text-anchor="middle" dominant-baseline="central">私钥</text>
<text class="ts" x="145" y="188" text-anchor="middle" dominant-baseline="central">只在这台 Mac，用来盖章</text>
<rect class="box" x="55" y="218" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="145" y="237" text-anchor="middle" dominant-baseline="central">证书</text>
<text class="ts" x="145" y="256" text-anchor="middle" dominant-baseline="central">公开身份，Apple 担保</text>
<rect class="box" x="55" y="286" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="145" y="305" text-anchor="middle" dominant-baseline="central">描述文件</text>
<text class="ts" x="145" y="324" text-anchor="middle" dominant-baseline="central">许可证：哪个 App、哪台设备</text>
<g class="c-gray">
<rect x="285" y="200" width="110" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="220" text-anchor="middle" dominant-baseline="central">签好名的 App</text>
<text class="ts" x="340" y="240" text-anchor="middle" dominant-baseline="central">codesign 生成</text>
<text class="ts" x="340" y="258" text-anchor="middle" dominant-baseline="central">内含描述文件</text>
</g>
<g class="c-purple">
<rect x="430" y="110" width="210" height="256" rx="16" stroke-width="0.5"/>
<text class="th" x="535" y="132" text-anchor="middle" dominant-baseline="central">iPhone 安装时检查</text>
</g>
<rect class="box" x="445" y="152" width="180" height="40" rx="6" stroke-width="0.5"/>
<text class="t" x="535" y="172" text-anchor="middle" dominant-baseline="central">签名有效、没被改过</text>
<rect class="box" x="445" y="204" width="180" height="40" rx="6" stroke-width="0.5"/>
<text class="t" x="535" y="224" text-anchor="middle" dominant-baseline="central">证书是 Apple 签发的</text>
<rect class="box" x="445" y="256" width="180" height="40" rx="6" stroke-width="0.5"/>
<text class="t" x="535" y="276" text-anchor="middle" dominant-baseline="central">描述文件含这台设备</text>
<rect class="box" x="445" y="308" width="180" height="40" rx="6" stroke-width="0.5"/>
<text class="t" x="535" y="328" text-anchor="middle" dominant-baseline="central">权限没超出描述文件</text>
<line x1="256" y1="86" x2="196" y2="108" class="arr" marker-end="url(#arrow)"/>
<line x1="424" y1="86" x2="484" y2="108" class="arr" marker-end="url(#arrow)"/>
<line x1="252" y1="238" x2="283" y2="238" class="arr" marker-end="url(#arrow)"/>
<line x1="397" y1="238" x2="428" y2="238" class="arr" marker-end="url(#arrow)"/>
<text x="672" y="384" text-anchor="end" style="font-size:11px;fill:#888780">示意图</text></svg>