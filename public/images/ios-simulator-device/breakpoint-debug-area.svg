<text class="t" x="76" y="262" dominant-baseline="central" style="font-family: var(--font-mono)">parts = 1 value</text>
<text class="t" x="96" y="288" dominant-baseline="central" style="font-family: var(--font-mono)">[0] = "你好世界"</text>
<rect class="box" x="336" y="212" width="304" height="124" rx="8" stroke-width="0.5"/>
<text class="ts" x="350" y="232" dominant-baseline="central" style="font-family: var(--font-mono)">(lldb) po parts</text>
<text class="t" x="350" y="254" dominant-baseline="central" style="font-family: var(--font-mono)">▿ 1 element</text>
<text class="t" x="366" y="276" dominant-baseline="central" style="font-family: var(--font-mono)">- 0 : "你好世界"</text>
<text class="ts" x="350" y="298" dominant-baseline="central" style="font-family: var(--font-mono)">(lldb) po text.count</text>
<text class="t" x="350" y="320" dominant-baseline="central" style="font-family: var(--font-mono)">4</text>
<g class="c-gray"><circle cx="46" cy="104" r="9" stroke-width="0.5"/><text class="th" x="46" y="104" text-anchor="middle" dominant-baseline="central">1</text></g>
