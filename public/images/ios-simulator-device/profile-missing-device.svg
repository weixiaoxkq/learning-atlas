<svg xmlns="http://www.w3.org/2000/svg" width="680" height="280" viewBox="0 0 680 280" role="img">
<title>描述文件需要证书、App ID 和设备三样</title>
<desc>左边三项：签名证书 Apple Development 已有，App ID io.github.weixiaoxkq.AINotes 已有，设备还没有，缺这一项。三项一起才能生成右边的描述文件 Provisioning Profile。连上 iPhone 后 Xcode 会自动注册设备，再点 Try Again 即可。</desc><style>svg{--t:#73726C;--b:#D3D1C7;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}.t{font-size:14px;fill:#1F1E1D}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#1F1E1D}.box{fill:#F5F4EF;stroke:#B4B2A9}.arr{stroke:#73726C;stroke-width:1.5;fill:none}.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.t,.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.t,.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.t,.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.t,.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-green>rect,.c-green>circle,.c-green>ellipse,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>.t,.c-green>.th{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>.t,.c-blue>.th{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.t,.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}</style><rect x="0" y="0" width="680" height="280" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal">
<rect x="40" y="30" width="250" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="165" y="49" text-anchor="middle" dominant-baseline="central">签名证书：谁签的</text>
<text class="ts" x="165" y="68" text-anchor="middle" dominant-baseline="central">Apple Development（已有）</text>
</g>
<g class="c-teal">
<rect x="40" y="100" width="250" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="165" y="119" text-anchor="middle" dominant-baseline="central">App ID：哪个 App</text>
<text class="ts" x="165" y="138" text-anchor="middle" dominant-baseline="central">io.github.weixiaoxkq.AINotes（已有）</text>
</g>
<g class="c-amber">
<rect x="40" y="170" width="250" height="56" rx="8" stroke-width="1" stroke-dasharray="5 4"/>
<text class="th" x="165" y="189" text-anchor="middle" dominant-baseline="central">设备：装到哪台手机</text>
<text class="ts" x="165" y="208" text-anchor="middle" dominant-baseline="central">一台都没有，缺这一项</text>
</g>
<g class="c-gray">
<rect x="420" y="92" width="220" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="530" y="112" text-anchor="middle" dominant-baseline="central">描述文件</text>
<text class="ts" x="530" y="131" text-anchor="middle" dominant-baseline="central">Provisioning Profile</text>
<text class="ts" x="530" y="149" text-anchor="middle" dominant-baseline="central">三样齐了才能生成</text>
</g>
<line x1="292" y1="58" x2="416" y2="110" class="arr" marker-end="url(#arrow)"/>
<line x1="292" y1="128" x2="416" y2="128" class="arr" marker-end="url(#arrow)"/>
<line x1="292" y1="198" x2="416" y2="146" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="254" text-anchor="middle" dominant-baseline="central">连上 iPhone 后 Xcode 会自动注册设备，再点 Try Again 就能生成</text>
<text x="672" y="272" text-anchor="end" style="font-size:11px;fill:#888780">示意图</text></svg>