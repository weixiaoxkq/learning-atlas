<svg xmlns="http://www.w3.org/2000/svg" width="680" height="262" viewBox="0 0 680 262" role="img">
<title>AI 协作的小步循环</title>
<desc>四步流程：1 AI 读项目说明 CLAUDE.md 等；2 小步修改，一次一件事；3 命令行构建 xcodebuild；4 看结果，成功或 error 行号。成功则 git commit 存档，然后回到第 2 步继续下一小步；失败则把错误交回 AI 修，或 git restore 回退，修好后回到第 3 步再构建。</desc><style>svg{--t:#73726C;--b:#D3D1C7;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}.t{font-size:14px;fill:#1F1E1D}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#1F1E1D}.box{fill:#F5F4EF;stroke:#B4B2A9}.arr{stroke:#73726C;stroke-width:1.5;fill:none}.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.t,.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.t,.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.t,.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.t,.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-green>rect,.c-green>circle,.c-green>ellipse,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>.t,.c-green>.th{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>.t,.c-blue>.th{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.t,.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}</style><rect x="0" y="0" width="680" height="262" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="box" x="40" y="40" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="105" y="59" text-anchor="middle" dominant-baseline="central">1 读项目说明</text>
<text class="ts" x="105" y="78" text-anchor="middle" dominant-baseline="central">CLAUDE.md 等</text>
<rect class="box" x="190" y="40" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="255" y="59" text-anchor="middle" dominant-baseline="central">2 小步修改</text>
<text class="ts" x="255" y="78" text-anchor="middle" dominant-baseline="central">一次一件事</text>
<rect class="box" x="340" y="40" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="405" y="59" text-anchor="middle" dominant-baseline="central">3 命令行构建</text>
<text class="ts" x="405" y="78" text-anchor="middle" dominant-baseline="central">xcodebuild</text>
<rect class="box" x="490" y="40" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="555" y="59" text-anchor="middle" dominant-baseline="central">4 看结果</text>
<text class="ts" x="555" y="78" text-anchor="middle" dominant-baseline="central">成功或 error 行号</text>
<line x1="172" y1="68" x2="188" y2="68" class="arr" marker-end="url(#arrow)"/>
<line x1="322" y1="68" x2="338" y2="68" class="arr" marker-end="url(#arrow)"/>
<line x1="472" y1="68" x2="488" y2="68" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal">
<rect x="290" y="150" width="180" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="380" y="169" text-anchor="middle" dominant-baseline="central">成功：git commit</text>
<text class="ts" x="380" y="188" text-anchor="middle" dominant-baseline="central">留一个存档点</text>
</g>
<g class="c-coral">
<rect x="490" y="150" width="150" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="565" y="169" text-anchor="middle" dominant-baseline="central">失败：交回 AI</text>
<text class="ts" x="565" y="188" text-anchor="middle" dominant-baseline="central">或 git restore 回退</text>
</g>
<line x1="530" y1="98" x2="410" y2="148" class="arr" marker-end="url(#arrow)"/>
<line x1="580" y1="98" x2="580" y2="148" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="380" y="232" text-anchor="middle" dominant-baseline="central">↻ 回到 2，做下一小步</text>
<text class="ts" x="565" y="232" text-anchor="middle" dominant-baseline="central">↻ 修好后回到 3</text>
<text x="672" y="254" text-anchor="end" style="font-size:11px;fill:#888780">示意图</text></svg>