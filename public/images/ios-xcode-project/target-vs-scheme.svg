<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img">
<title>Target 与 Scheme 的关系</title>
<desc>左边三个 Target：AINotes App 本体产出 .app，AINotesWidget 小组件产出 .appex 并嵌进 App，AINotesTests 产出 .xctest。右边一个名为 AINotes 的 Scheme，包含 Run 用 Debug、Archive 用 Release、Test 用 Debug 等动作。Run 和 Archive 指向 App Target，Test 指向测试 Target；构建 App 时连带构建小组件。</desc><style>svg{--t:#73726C;--b:#D3D1C7;--font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}.t{font-size:14px;fill:#1F1E1D}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:500;fill:#1F1E1D}.box{fill:#F5F4EF;stroke:#B4B2A9}.arr{stroke:#73726C;stroke-width:1.5;fill:none}.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}.c-gray>rect,.c-gray>circle,.c-gray>ellipse,rect.c-gray,circle.c-gray,ellipse.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-gray>.t,.c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5F5E5A}.c-teal>rect,.c-teal>circle,.c-teal>ellipse,rect.c-teal,circle.c-teal,ellipse.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-teal>.t,.c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0F6E56}.c-purple>rect,.c-purple>circle,.c-purple>ellipse,rect.c-purple,circle.c-purple,ellipse.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-purple>.t,.c-purple>.th{fill:#3C3489}.c-purple>.ts{fill:#534AB7}.c-amber>rect,.c-amber>circle,.c-amber>ellipse,rect.c-amber,circle.c-amber,ellipse.c-amber{fill:#FAEEDA;stroke:#854F0B}.c-amber>.t,.c-amber>.th{fill:#633806}.c-amber>.ts{fill:#854F0B}.c-green>rect,.c-green>circle,.c-green>ellipse,rect.c-green,circle.c-green,ellipse.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green>.t,.c-green>.th{fill:#27500A}.c-green>.ts{fill:#3B6D11}.c-blue>rect,.c-blue>circle,.c-blue>ellipse,rect.c-blue,circle.c-blue,ellipse.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue>.t,.c-blue>.th{fill:#0C447C}.c-blue>.ts{fill:#185FA5}.c-coral>rect,.c-coral>circle,.c-coral>ellipse,rect.c-coral,circle.c-coral,ellipse.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral>.t,.c-coral>.th{fill:#712B13}.c-coral>.ts{fill:#993C1D}</style><rect x="0" y="0" width="680" height="380" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="170" y="38" text-anchor="middle" dominant-baseline="central">Target：造什么</text>
<text class="th" x="510" y="38" text-anchor="middle" dominant-baseline="central">Scheme「AINotes」：怎么跑</text>
<g class="c-teal">
<rect x="40" y="62" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="81" text-anchor="middle" dominant-baseline="central">AINotes（App 本体）</text>
<text class="ts" x="170" y="100" text-anchor="middle" dominant-baseline="central">产出 AINotes.app</text>
</g>
<g class="c-teal">
<rect x="40" y="162" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="181" text-anchor="middle" dominant-baseline="central">AINotesWidget（小组件）</text>
<text class="ts" x="170" y="200" text-anchor="middle" dominant-baseline="central">产出 .appex，嵌进 App</text>
</g>
<g class="c-teal">
<rect x="40" y="262" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="281" text-anchor="middle" dominant-baseline="central">AINotesTests（测试）</text>
<text class="ts" x="170" y="300" text-anchor="middle" dominant-baseline="central">产出 .xctest</text>
</g>
<line x1="170" y1="120" x2="170" y2="158" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<g class="c-purple">
<rect x="380" y="56" width="260" height="268" rx="12" stroke-width="0.5"/>
<text class="ts" x="510" y="196" text-anchor="middle" dominant-baseline="central">Profile、Analyze 等动作同理</text>
</g>
<rect class="box" x="396" y="66" width="228" height="36" rx="6" stroke-width="0.5"/>
<text class="th" x="410" y="84" dominant-baseline="central">Run（▶ / ⌘R）</text>
<text class="ts" x="612" y="84" text-anchor="end" dominant-baseline="central">Debug</text>
<rect class="box" x="396" y="110" width="228" height="36" rx="6" stroke-width="0.5"/>
<text class="th" x="410" y="128" dominant-baseline="central">Archive（打包上架）</text>
<text class="ts" x="612" y="128" text-anchor="end" dominant-baseline="central">Release</text>
<rect class="box" x="396" y="272" width="228" height="36" rx="6" stroke-width="0.5"/>
<text class="th" x="410" y="290" dominant-baseline="central">Test（⌘U）</text>
<text class="ts" x="612" y="290" text-anchor="end" dominant-baseline="central">Debug</text>
<line x1="394" y1="84" x2="304" y2="84" class="arr" marker-end="url(#arrow)"/>
<line x1="394" y1="128" x2="304" y2="104" class="arr" marker-end="url(#arrow)"/>
<line x1="394" y1="290" x2="304" y2="290" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="352" text-anchor="middle" dominant-baseline="central">实线：这个动作构建哪个 Target　虚线：构建 App 时连带构建小组件</text>
<text x="672" y="372" text-anchor="end" style="font-size:11px;fill:#888780">示意图</text></svg>